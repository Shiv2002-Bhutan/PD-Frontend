name: Build and Publish Storefront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/shiv2002-bhutan/pd-frontend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/
            VITE_WHATSAPP_NUMBER=97517308033
            VITE_FACEBOOK_LINK=https://www.facebook.com/share/1MBMVkfaAN/
            VITE_CONTACT=+97517111333
            VITE_GMAIL=pdfurniture1987@gmail.com
          tags: |
            ghcr.io/shiv2002-bhutan/pd-frontend:latest
            ghcr.io/shiv2002-bhutan/pd-frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
