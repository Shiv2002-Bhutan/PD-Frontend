server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: serve the app for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache versioned static assets
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Do not cache the HTML entry point
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Enable gzip for text-based responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
